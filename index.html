<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Floor 3D</title>
    <meta name="description" content="A walkable 3D trading floor of live AG Grid and ECharts screens, built with Chrome's HTML-in-Canvas API." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161a23'/%3E%3Cpath d='M6 21l6-6 5 4 9-10' stroke='%23ffa826' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" />
  </head>
  <body>
    <!--
      content="drawable" opts this canvas into laying out its children.
      Every panel (AG Grid, ECharts, plain HTML) is appended as a `drawable`
      child at runtime and uploaded into a WebGL texture by src/drawable.ts.
    -->
    <canvas id="floor" content="drawable" aria-label="3D trading floor"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
